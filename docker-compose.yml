# DEV twin (sweat-dev.wingfield.tech), deployed by ./deploy.sh to ~/services/app-dev/ on oracle.
# Prod has its own file: docker-compose.prod.yml (deploy.sh --prod ships that one).
#
# The service name is also a DNS alias on the shared `edge` network, so dev and prod
# MUST differ (`app-dev` here, `app` in prod); a shared name would round-robin the
# tunnel upstream between the two.
services:
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app-dev
    ports:
      - "100.86.226.52:3005:3000"   # tailnet only, never 0.0.0.0
    volumes:
      - ./data:/data                # SQLite lives here (app.db); excluded from rsync
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - default
      - edge

networks:
  edge:
    external: true
    name: edge
