route:
  receiver: stage-private-receiver
  group_by: [alertname]
  group_wait: 1s
  group_interval: 5s
  repeat_interval: 2h

receivers:
  - name: stage-private-receiver
    webhook_configs:
      - url: http://receiver:9091/webhook
        send_resolved: true
        max_alerts: 20
        http_config:
          authorization:
            type: Bearer
            credentials_file: /run/secrets/receiver_token
