name: sweatassistant-mcp-stage-ops
services:
  prometheus:
    image: docker.io/prom/prometheus@sha256:13020b7e520d56fef031135b91f5635888de441d6c4cfda3608bfbf6f4916dcb
    container_name: mcp-stage-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=512MB
      - --web.enable-lifecycle
      - --web.listen-address=0.0.0.0:9090
    user: "65534:65534"
    read_only: true
    tmpfs: ["/tmp:size=16m,noexec,nosuid"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./rules:/etc/prometheus/rules:ro
      - ./secrets/metrics_token:/run/secrets/metrics_token:ro
      - ./data/prometheus:/prometheus
    mem_limit: 256m
    cpus: "0.25"
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: { driver: json-file, options: { max-size: "5m", max-file: "2" } }
    restart: unless-stopped
    networks: [ops-private, stage-private]

  alertmanager:
    image: docker.io/prom/alertmanager@sha256:47a1dc7e74f1e755e29f74d392262f8d1da41f2ada5653911199bf07219e41d9
    container_name: mcp-stage-alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=0.0.0.0:9093
    user: "65534:65534"
    read_only: true
    tmpfs: ["/tmp:size=8m,noexec,nosuid"]
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./secrets/alertmanager_token:/run/secrets/receiver_token:ro
      - ./data/alertmanager:/alertmanager
    mem_limit: 64m
    cpus: "0.10"
    pids_limit: 32
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: { driver: json-file, options: { max-size: "3m", max-file: "2" } }
    restart: unless-stopped
    networks: [ops-private]

  receiver:
    image: docker.io/library/node:20.19.0-bookworm-slim@sha256:0de002791ac0ff15f75a30c28b9b1d4d44bfd3d7e72942b7ab0f72d8ef0b3c43
    container_name: mcp-stage-alert-receiver
    command: [node, /opt/receiver.js]
    environment:
      PORT: "9091"
      RECEIVER_TOKEN_FILE: /run/secrets/receiver_token
      RECEIVER_STATE_DIR: /state
      NODE_OPTIONS: --max-old-space-size=20
    user: "1000:1000"
    read_only: true
    tmpfs: ["/tmp:size=8m,noexec,nosuid"]
    volumes:
      - ./receiver.js:/opt/receiver.js:ro
      - ./secrets/receiver_token:/run/secrets/receiver_token:ro
      - ./data/receiver:/state
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:9091/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    mem_limit: 64m
    cpus: "0.10"
    pids_limit: 16
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: { driver: json-file, options: { max-size: "2m", max-file: "2" } }
    restart: unless-stopped
    networks: [ops-private]

  grafana:
    image: docker.io/grafana/grafana@sha256:15254b507dd6da013d57af4fc7e902721110b70d37282ab9ae866290803bd752
    container_name: mcp-stage-grafana
    env_file: [.env.grafana]
    environment:
      GF_SECURITY_ADMIN_USER: mcp-stage-ops
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: ""
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_ANGULAR_SUPPORT_ENABLED: "false"
      GF_LOG_MODE: console
      GF_SERVER_HTTP_PORT: "3000"
    ports:
      - "100.86.226.52:3031:3000"
    read_only: true
    tmpfs: ["/tmp:size=32m,noexec,nosuid"]
    volumes:
      - ./grafana-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./grafana-dashboard-provider.yml:/etc/grafana/provisioning/dashboards/provider.yml:ro
      - ./grafana-dashboard.json:/etc/grafana/dashboards/mcp-stage.json:ro
      - ./data/grafana:/var/lib/grafana
    mem_limit: 512m
    cpus: "0.50"
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: { driver: json-file, options: { max-size: "5m", max-file: "2" } }
    restart: unless-stopped
    networks: [ops-private]

networks:
  ops-private:
    driver: bridge
    internal: true
  stage-private:
    external: true
    name: sweatassistant-mcp-stage_mcp-stage-private
