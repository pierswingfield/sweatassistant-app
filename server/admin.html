<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sweat Assistant — Admin</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0e0d;
      --surface: #1a1816;
      --surface-2: #252220;
      --border: #2e2b28;
      --text: #e8e0d5;
      --text-muted: #8a8278;
      --accent: #e87d3e;
      --accent-dim: rgba(232,125,62,0.15);
      --green: #5aab6e;
      --red: #c9534f;
      --red-dim: rgba(201,83,79,0.15);
      --radius: 8px;
      --mono: 'SF Mono', 'Fira Code', monospace;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 0;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { font-size: 15px; font-weight: 600; letter-spacing: 0.02em; color: var(--text); }
    header span { font-size: 11px; color: var(--text-muted); font-family: var(--mono); background: var(--surface-2); padding: 3px 8px; border-radius: 4px; border: 1px solid var(--border); }

    /* Login screen */
    #login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 53px);
    }
    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
      width: 320px;
    }
    .login-card h2 { font-size: 16px; margin-bottom: 20px; }
    .login-card label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
    .login-card input[type=password] {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      padding: 10px 12px;
      font-size: 14px;
      outline: none;
      margin-bottom: 16px;
    }
    .login-card input[type=password]:focus { border-color: var(--accent); }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 500;
      border: none;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:disabled { opacity: 0.4; cursor: default; }
    .btn-primary { background: var(--accent); color: #fff; width: 100%; justify-content: center; padding: 10px; }
    .btn-primary:hover:not(:disabled) { opacity: 0.85; }
    .btn-danger { background: var(--red-dim); color: var(--red); border: 1px solid rgba(201,83,79,0.3); font-size: 12px; padding: 4px 10px; }
    .btn-danger:hover:not(:disabled) { background: var(--red); color: #fff; }
    .error-msg { color: var(--red); font-size: 12px; margin-top: 10px; display: none; }

    /* Main panel */
    #admin-screen { display: none; padding: 24px; }
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .panel-header h2 { font-size: 14px; color: var(--text-muted); font-weight: 500; }
    .stats { display: flex; gap: 12px; }
    .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 6px 14px; font-size: 12px; color: var(--text-muted); }
    .stat strong { color: var(--text); font-size: 14px; display: block; }

    /* Table */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead th {
      text-align: left;
      padding: 8px 12px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    tbody tr { border-bottom: 1px solid var(--border); }
    tbody tr:hover { background: var(--surface); }
    tbody td { padding: 10px 12px; vertical-align: middle; }

    .name { font-weight: 500; }
    .email { font-size: 11px; color: var(--text-muted); font-family: var(--mono); }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      font-family: var(--mono);
    }
    .badge-pending { background: var(--accent-dim); color: var(--accent); }
    .badge-upgrades { background: rgba(90,171,110,0.15); color: var(--green); }
    .badge-zero { color: var(--text-muted); }

    /* Inline priority editor */
    .priority-cell { display: flex; align-items: center; gap: 6px; }
    .priority-input {
      width: 56px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      padding: 4px 8px;
      font-size: 13px;
      font-family: var(--mono);
      text-align: center;
      outline: none;
    }
    .priority-input:focus { border-color: var(--accent); }
    .priority-input.saving { opacity: 0.5; }
    .priority-vip { border-color: var(--accent); background: var(--accent-dim); }

    .created { font-size: 11px; color: var(--text-muted); font-family: var(--mono); }

    .loading { padding: 40px; text-align: center; color: var(--text-muted); }
    .logout-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-muted);
      font-size: 12px;
      padding: 5px 12px;
      cursor: pointer;
    }
    .logout-btn:hover { border-color: var(--text-muted); color: var(--text); }

    .confirm-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .confirm-overlay.open { display: flex; }
    .confirm-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      width: 340px;
    }
    .confirm-card h3 { font-size: 15px; margin-bottom: 8px; }
    .confirm-card p { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.5; }
    .confirm-actions { display: flex; gap: 10px; justify-content: flex-end; }
    .btn-ghost { background: none; border: 1px solid var(--border); color: var(--text-muted); }
    .btn-ghost:hover { border-color: var(--text-muted); color: var(--text); }

    /* Clickable user name */
    .name-btn { background: none; border: none; padding: 0; color: var(--text); font: inherit; font-weight: 500; cursor: pointer; text-align: left; }
    .name-btn:hover { color: var(--accent); }
    .last-seen { font-size: 11px; color: var(--text-muted); font-family: var(--mono); }
    .last-seen.stale { color: var(--red); }

    /* Detail drawer */
    .drawer-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      display: none; z-index: 80;
    }
    .drawer-overlay.open { display: block; }
    .drawer {
      position: fixed; top: 0; right: 0; bottom: 0;
      width: 560px; max-width: 92vw;
      background: var(--bg);
      border-left: 1px solid var(--border);
      box-shadow: -8px 0 32px rgba(0,0,0,0.4);
      transform: translateX(100%);
      transition: transform 0.22s cubic-bezier(0.25,1,0.5,1);
      z-index: 90;
      display: flex; flex-direction: column;
    }
    .drawer.open { transform: translateX(0); }
    .drawer-head {
      display: flex; align-items: flex-start; justify-content: space-between;
      padding: 18px 22px; border-bottom: 1px solid var(--border);
      background: var(--surface); position: sticky; top: 0;
    }
    .drawer-head h2 { font-size: 17px; font-weight: 600; }
    .drawer-head .email { margin-top: 3px; }
    .drawer-close {
      background: none; border: 1px solid var(--border); border-radius: var(--radius);
      color: var(--text-muted); width: 30px; height: 30px; cursor: pointer; font-size: 16px; line-height: 1;
      flex-shrink: 0;
    }
    .drawer-close:hover { border-color: var(--text-muted); color: var(--text); }
    .drawer-body { overflow-y: auto; padding: 20px 22px; flex: 1; }
    .drawer-body.loading { display: flex; align-items: center; justify-content: center; color: var(--text-muted); }

    .section { margin-bottom: 26px; }
    .section-title {
      font-size: 11px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase;
      color: var(--text-muted); margin-bottom: 10px; display: flex; align-items: center; gap: 8px;
    }
    .section-title .count {
      background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
      padding: 1px 7px; font-size: 10px; font-family: var(--mono); color: var(--text-muted);
    }
    .kv-grid { display: grid; grid-template-columns: auto 1fr; gap: 7px 16px; font-size: 13px; }
    .kv-grid dt { color: var(--text-muted); white-space: nowrap; }
    .kv-grid dd { color: var(--text); text-align: right; font-variant-numeric: tabular-nums; }

    .stat-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .stat-box {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 8px 12px; flex: 1; min-width: 110px;
    }
    .stat-box .v { font-size: 18px; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
    .stat-box .l { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

    .item {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 10px 12px; margin-bottom: 8px; font-size: 13px;
    }
    .item-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .item-title { font-weight: 500; }
    .item-sub { font-size: 11px; color: var(--text-muted); margin-top: 3px; font-family: var(--mono); }
    .item-meta { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

    .pill {
      display: inline-block; padding: 2px 8px; border-radius: 10px;
      font-size: 10px; font-weight: 600; font-family: var(--mono); white-space: nowrap;
    }
    .pill-green { background: rgba(90,171,110,0.15); color: var(--green); }
    .pill-accent { background: var(--accent-dim); color: var(--accent); }
    .pill-red { background: var(--red-dim); color: var(--red); }
    .relogin-issues { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px; }
    .pill-muted { background: var(--surface-2); color: var(--text-muted); }

    .chip-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
    .chip {
      background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px;
      padding: 2px 7px; font-size: 11px; font-family: var(--mono); color: var(--text);
    }
    .chip.rank { background: var(--accent-dim); color: var(--accent); border-color: transparent; }

    .empty { font-size: 12px; color: var(--text-muted); font-style: italic; padding: 4px 0; }
    .err-banner { color: var(--red); font-size: 13px; }

    .history-toggle {
      background: var(--surface-2); border: 1px solid var(--border); color: var(--text-muted);
      border-radius: var(--radius); padding: 6px 12px; font-size: 12px; cursor: pointer; margin-top: 10px;
      width: 100%; text-align: center;
    }
    .history-toggle:hover { border-color: var(--text-muted); color: var(--text); }
    .history-block { display: none; margin-top: 10px; }
    .history-block.open { display: block; }
    .history-block .empty { text-align: center; padding: 10px 0; }
    .pager { display: flex; align-items: center; gap: 10px; justify-content: center; margin-top: 10px; font-size: 12px; color: var(--text-muted); }
    .pager button {
      background: var(--surface-2); border: 1px solid var(--border); color: var(--text-muted);
      border-radius: 4px; padding: 3px 10px; cursor: pointer; font-size: 12px;
    }
    .pager button:disabled { opacity: 0.4; cursor: default; }

    /* F-7 Stage B: gym presentation editor */
    #gym-editor { padding: 24px; border-top: 1px solid var(--border); }
    #gym-editor h2 { font-size: 16px; margin-bottom: 12px; }
    .ge-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px 20px; margin-top: 12px; }
    .ge-grid label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 3px; }
    .ge-grid input, .ge-grid textarea, #ge-gym { width: 100%; background: var(--surface-2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font-size: 13px; font-family: inherit; }
    .ge-grid textarea { font-family: var(--mono); min-height: 70px; }
    .ge-colors { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .ge-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; align-items: center; }
    .ge-actions .btn { width: auto; padding: 6px 14px; background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
    .ge-actions .btn.ge-save { background: var(--accent); color: #fff; border-color: transparent; }
    #ge-msg { font-size: 12px; margin-top: 8px; min-height: 16px; }
    #ge-msg.err { color: var(--red); } #ge-msg.ok { color: var(--green); }
    .ge-previews { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
    .ge-preview { border-radius: 10px; padding: 14px; border: 1px solid var(--border); }
    .ge-preview .pv-title { font-size: 11px; opacity: .7; margin-bottom: 8px; }
    .ge-preview .pv-plate { display: inline-flex; align-items: center; min-height: 34px; padding: 4px 12px; border-radius: 8px; font-weight: 700; letter-spacing: .06em; }
    .ge-preview .pv-plate img { max-height: 26px; display: block; }
    .ge-preview .pv-row { margin-top: 10px; padding: 8px 10px; border-radius: 8px; font-size: 13px; display: flex; gap: 8px; align-items: center; justify-content: space-between; }
    .ge-preview .pv-pill { padding: 2px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; }
    @media (max-width: 600px) { .ge-previews { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<header>
  <h1>Sweat Assistant — Admin</h1>
  <span id="session-label"></span>
</header>

<!-- Login -->
<div id="login-screen">
  <div class="login-card">
    <h2>Admin Login</h2>
    <label for="pw">Password</label>
    <input type="password" id="pw" autocomplete="current-password" placeholder="Admin password">
    <button class="btn btn-primary" id="login-btn">Sign in</button>
    <div class="error-msg" id="login-error"></div>
  </div>
</div>

<!-- Main -->
<div id="admin-screen">
  <div class="panel-header">
    <h2>Users</h2>
    <div style="display:flex;gap:10px;align-items:center">
      <div class="stats" id="stats"></div>
      <button class="logout-btn" id="logout-btn">Log out</button>
    </div>
  </div>
  <div class="table-wrap">
    <table id="user-table">
      <thead>
        <tr>
          <th>Name / Email</th>
          <th>Priority</th>
          <th>Auto-Books</th>
          <th>Upgrades</th>
          <th>Last seen</th>
          <th>Joined</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="user-tbody"><tr><td colspan="7" class="loading">Loading…</td></tr></tbody>
    </table>
  </div>

  <section id="gym-editor">
    <h2>Gym presentation</h2>
    <p style="font-size:12px;color:var(--text-muted);margin-bottom:10px">Display only. Tenant URLs, headers, capabilities and booking policy are set in gyms.config.js and cannot be edited here.</p>
    <select id="ge-gym" aria-label="Gym"></select>
    <div class="ge-grid">
      <div><label for="ge-short">Short name</label><input id="ge-short"></div>
      <div><label for="ge-text">Wordmark text fallback</label><input id="ge-text"></div>
      <div><label for="ge-full">Full wordmark path (/gyms/...)</label><input id="ge-full"></div>
      <div><label for="ge-compact">Compact wordmark path</label><input id="ge-compact"></div>
      <div><label for="ge-mark">Mark path</label><input id="ge-mark"></div>
      <div><label><input type="checkbox" id="ge-squaremark"> Use the mark in square/narrow chips (for very wide wordmarks)</label></div>
      <div><label for="ge-plate">Logo plate colour</label><input id="ge-plate" placeholder="#rrggbb"></div>
      <div><label>Light: ink / inkHover / tint / on / btn / wash / pip</label><div class="ge-colors" id="ge-light"></div></div>
      <div><label>Dark: ink / inkHover / tint / on / btn / wash / pip</label><div class="ge-colors" id="ge-dark"></div></div>
      <div style="grid-column:1/-1"><label for="ge-aliases">Display aliases (JSON: scope to lower-case raw name to shown name)</label><textarea id="ge-aliases"></textarea></div>
    </div>
    <div class="ge-actions">
      <button class="btn" id="ge-validate">Validate</button>
      <button class="btn ge-save" id="ge-save">Save</button>
      <button class="btn" id="ge-reset">Reset to registry</button>
      <button class="btn" id="ge-test">Test connection</button>
      <span id="ge-badge" style="font-size:12px;color:var(--text-muted)"></span>
    </div>
    <div id="ge-msg" role="status"></div>
    <div class="ge-previews" id="ge-previews"></div>
  </section>
</div>

<!-- User detail drawer -->
<div class="drawer-overlay" id="drawer-overlay"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <div>
      <h2 id="drawer-name">—</h2>
      <div class="email" id="drawer-email"></div>
      <!-- C3-8: only shown for a multi-gym account — lets the admin view the
           detail bundle (session, priority, queue, monitors, spot maps) for a
           gym OTHER than the account's default. Hidden entirely for a
           single-gym account, which is unaffected. -->
      <select id="drawer-gym-picker" style="display:none; margin-top:6px; font-size:12px; padding:3px 6px; border-radius:6px; border:1px solid var(--border); background:var(--surface-2); color:var(--text);"></select>
    </div>
    <button class="drawer-close" id="drawer-close" aria-label="Close">&times;</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</div>

<!-- Password reset modal (account-recovery escape hatch — see admin.js) -->
<div class="confirm-overlay" id="reset-overlay">
  <div class="confirm-card" style="max-width:520px;">
    <h3>Reset account password?</h3>
    <p id="reset-text"></p>
    <label style="display:flex;gap:8px;align-items:flex-start;margin:14px 0;font-size:13px;line-height:1.5;">
      <input type="checkbox" id="reset-clear-gyms" checked style="margin-top:3px;">
      <span>Also clear stored gym credentials.
        <span style="color:var(--text-muted);display:block;font-size:12px;">
          Recommended. The user re-authenticates each gym; their queue, spot maps and priority tier are kept.
          Uncheck only for a routine forgotten password where the account was never at risk.
        </span>
      </span>
    </label>
    <div id="reset-result" style="display:none;margin:14px 0;"></div>
    <div class="confirm-actions">
      <button class="btn btn-ghost" id="reset-cancel">Cancel</button>
      <button class="btn btn-danger" id="reset-ok">Reset password</button>
    </div>
  </div>
</div>

<!-- Delete confirm modal -->
<div class="confirm-overlay" id="confirm-overlay">
  <div class="confirm-card">
    <h3>Delete user?</h3>
    <p id="confirm-text"></p>
    <div class="confirm-actions">
      <button class="btn btn-ghost" id="confirm-cancel">Cancel</button>
      <button class="btn btn-danger" id="confirm-ok">Delete</button>
    </div>
  </div>
</div>

<script>
  const TOKEN_KEY = 'psycleAdminToken';
  let adminToken = localStorage.getItem(TOKEN_KEY);
  let pendingDelete = null;
  let currentDetail = null;
  let abHistoryPage = 0, auHistoryPage = 0;
  const HISTORY_PAGE_SIZE = 5;

  // ── Auth ──────────────────────────────────────────────────────────────────

  function setToken(t) {
    adminToken = t;
    if (t) localStorage.setItem(TOKEN_KEY, t);
    else localStorage.removeItem(TOKEN_KEY);
  }

  function showLogin(msg) {
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('admin-screen').style.display = 'none';
    document.getElementById('session-label').textContent = '';
    if (msg) {
      const el = document.getElementById('login-error');
      el.textContent = msg;
      el.style.display = 'block';
    }
  }

  function showAdmin() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('admin-screen').style.display = 'block';
    document.getElementById('session-label').textContent = 'admin session';
    loadUsers();
    loadGymEditor();
  }

  async function doLogin() {
    const pw = document.getElementById('pw').value;
    const btn = document.getElementById('login-btn');
    const errEl = document.getElementById('login-error');
    errEl.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Signing in…';
    try {
      const res = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pw })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || 'Login failed');
      setToken(data.token);
      showAdmin();
    } catch (e) {
      errEl.textContent = e.message;
      errEl.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Sign in';
    }
  }

  function doLogout() {
    setToken(null);
    showLogin();
  }

  // ── Users ─────────────────────────────────────────────────────────────────

  let pendingReset = null;

  async function apiFetch(url, opts = {}) {
    const res = await fetch(url, {
      ...opts,
      headers: { 'Authorization': `Bearer ${adminToken}`, 'Content-Type': 'application/json', ...(opts.headers || {}) }
    });
    if (res.status === 401 || res.status === 403) {
      setToken(null);
      showLogin('Session expired — please log in again.');
      throw new Error('Session expired');
    }
    return res;
  }

  async function loadUsers() {
    const tbody = document.getElementById('user-tbody');
    tbody.innerHTML = '<tr><td colspan="7" class="loading">Loading…</td></tr>';
    try {
      const res = await apiFetch('/api/admin/users');
      const { users } = await res.json();
      renderUsers(users);
    } catch (e) {
      if (adminToken) tbody.innerHTML = `<tr><td colspan="7" class="loading" style="color:var(--red)">${e.message}</td></tr>`;
    }
  }

  function renderUsers(users) {
    const tbody = document.getElementById('user-tbody');
    const statsEl = document.getElementById('stats');

    const totalPending = users.reduce((s, u) => s + (u.pending_bookings || 0), 0);
    const totalUpgrades = users.reduce((s, u) => s + (u.active_upgrades || 0), 0);
    statsEl.innerHTML = `
      <div class="stat"><strong>${users.length}</strong> users</div>
      <div class="stat"><strong>${totalPending}</strong> pending books</div>
      <div class="stat"><strong>${totalUpgrades}</strong> active upgrades</div>
    `;

    if (users.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" class="loading">No users yet.</td></tr>';
      return;
    }

    tbody.innerHTML = users.map(u => {
      const name = u.display_name || '—';
      const joined = u.created_at ? new Date(u.created_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '—';
      const isVip = (u.priority || 100) < 100;
      const pendingBadge = u.pending_bookings > 0
        ? `<span class="badge badge-pending">${u.pending_bookings}</span>`
        : `<span class="badge-zero">—</span>`;
      const upgradesBadge = u.active_upgrades > 0
        ? `<span class="badge badge-upgrades">${u.active_upgrades}</span>`
        : `<span class="badge-zero">—</span>`;
      const seen = relativeTime(u.last_seen_at);
      const seenStale = u.last_seen_at && (Date.now() - new Date(u.last_seen_at).getTime()) > 14 * 864e5;
      return `<tr data-id="${u.id}">
        <td>
          <button class="name-btn" data-detail-id="${u.id}">${escHtml(name)}</button>
          <div class="email">${escHtml(u.email)}</div>
          ${reloginBadges(u.relogin_issues)}
        </td>
        <td>
          <div class="priority-cell">
            <input
              type="number"
              min="1" max="999"
              class="priority-input${isVip ? ' priority-vip' : ''}"
              value="${u.priority || 100}"
              data-user-id="${u.id}"
              data-original="${u.priority || 100}"
              title="Lower = higher priority. Default 100."
            >
          </div>
        </td>
        <td>${pendingBadge}</td>
        <td>${upgradesBadge}</td>
        <td><span class="last-seen${seenStale ? ' stale' : ''}">${seen}</span></td>
        <td><span class="created">${joined}</span></td>
        <td>
          <button class="btn reset-pw-btn" data-user-id="${u.id}" data-email="${escHtml(u.email)}"
                  title="Generate a new password for this account">
            Reset password
          </button>
          <button class="btn btn-danger delete-btn" data-user-id="${u.id}" data-name="${escHtml(name)}" data-email="${escHtml(u.email)}">
            Delete
          </button>
        </td>
      </tr>`;
    }).join('');

    // Priority save on blur or Enter
    tbody.querySelectorAll('.priority-input').forEach(input => {
      async function savePriority() {
        const userId = parseInt(input.dataset.userId, 10);
        const val = parseInt(input.value, 10);
        const original = parseInt(input.dataset.original, 10);
        if (isNaN(val) || val === original) return;
        input.classList.add('saving');
        try {
          const res = await apiFetch(`/api/admin/users/${userId}/priority`, {
            method: 'PUT',
            body: JSON.stringify({ priority: val })
          });
          if (!res.ok) { const d = await res.json(); throw new Error(d.message); }
          input.dataset.original = val;
          input.classList.toggle('priority-vip', val < 100);
        } catch (e) {
          input.value = original;
          alert(e.message);
        } finally {
          input.classList.remove('saving');
        }
      }
      input.addEventListener('blur', savePriority);
      input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); input.blur(); } });
    });

    // Delete buttons
    tbody.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        pendingDelete = { id: parseInt(btn.dataset.userId, 10), name: btn.dataset.name, email: btn.dataset.email };
        document.getElementById('confirm-text').textContent =
          `This will permanently delete "${pendingDelete.name}" (${pendingDelete.email}) and all their data — bookings, upgrades, preferences, credentials. This cannot be undone.`;
        document.getElementById('confirm-overlay').classList.add('open');
      });
    });

    // Reset password → the account-recovery escape hatch (there is no
    // self-service reset; see admin.js and Documentation/Workstreams/C6-accounts-auth.md (C6-1)).
    tbody.querySelectorAll('.reset-pw-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        pendingReset = { id: parseInt(btn.dataset.userId, 10), email: btn.dataset.email };
        document.getElementById('reset-text').textContent =
          `A new password will be generated for ${pendingReset.email} and shown once. ` +
          `Their current password stops working immediately.`;
        document.getElementById('reset-result').style.display = 'none';
        document.getElementById('reset-clear-gyms').checked = true;
        document.getElementById('reset-ok').style.display = '';
        document.getElementById('reset-cancel').textContent = 'Cancel';
        document.getElementById('reset-overlay').classList.add('open');
      });
    });

    // Name → open detail drawer
    tbody.querySelectorAll('.name-btn').forEach(btn => {
      btn.addEventListener('click', () => openDetail(parseInt(btn.dataset.detailId, 10)));
    });
  }

  // ── Detail drawer ───────────────────────────────────────────────────────────

  function openDrawer() { document.getElementById('drawer-overlay').classList.add('open'); document.getElementById('drawer').classList.add('open'); }
  function closeDrawer() { document.getElementById('drawer-overlay').classList.remove('open'); document.getElementById('drawer').classList.remove('open'); }

  let currentDrawerUserId = null;

  // C3-8: `gymId` is optional — passed as `?gymId=` so the admin can view a
  // linked gym OTHER than the account's default (which is all the route used
  // to ever resolve). Re-invoked by the picker's onchange below.
  async function openDetail(userId, gymId) {
    currentDrawerUserId = userId;
    const body = document.getElementById('drawer-body');
    document.getElementById('drawer-name').textContent = '—';
    document.getElementById('drawer-email').textContent = '';
    const picker = document.getElementById('drawer-gym-picker');
    picker.style.display = 'none';
    body.className = 'drawer-body loading';
    body.textContent = 'Loading…';
    openDrawer();
    try {
      const qs = gymId ? `?gymId=${encodeURIComponent(gymId)}` : '';
      const res = await apiFetch(`/api/admin/users/${userId}${qs}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || 'Failed to load user.');
      renderDetail(data);
    } catch (e) {
      body.className = 'drawer-body';
      body.innerHTML = `<div class="err-banner">${escHtml(e.message)}</div>`;
    }
  }

  function renderGymPicker(d) {
    const picker = document.getElementById('drawer-gym-picker');
    const gyms = d.gyms || [];
    if (gyms.length < 2) { picker.style.display = 'none'; picker.innerHTML = ''; return; }
    picker.innerHTML = gyms.map(g =>
      `<option value="${escHtml(g.gym_id)}"${g.gym_id === d.viewedGymId ? ' selected' : ''}>${escHtml(g.gym_name)}${g.gym_id === d.viewedGymId ? ' (viewing)' : ''}</option>`
    ).join('');
    picker.style.display = '';
    picker.onchange = () => openDetail(currentDrawerUserId, picker.value);
  }

  function renderDetail(d) {
    currentDetail = d;
    abHistoryPage = 0;
    auHistoryPage = 0;
    const fullName = [d.profile.firstName, d.profile.lastName].filter(Boolean).join(' ') || d.user.display_name || '—';
    document.getElementById('drawer-name').textContent = fullName;
    document.getElementById('drawer-email').innerHTML = `<span class="email">${escHtml(d.user.email)}</span>`;
    renderGymPicker(d);

    const body = document.getElementById('drawer-body');
    body.className = 'drawer-body';
    body.innerHTML = [
      sectionOverview(d),
      sectionGyms(d),
      sectionBookingWindow(d),
      sectionStats(d),
      sectionCredits(d),
      sectionSubscriptions(d),
      sectionBookings(d),
      sectionAutoBook(d),
      sectionAutoUpgrade(d),
      sectionSpotMaps(d),
    ].join('');
    wireHistoryControls();
  }

  // ── Drawer sections ───────────────────────────────────────────────────────

  function sectionOverview(d) {
    const p = d.profile, u = d.user;
    const rows = [
      ['Priority', (u.priority || 100) < 100 ? `<span class="pill pill-accent">${u.priority} · VIP</span>` : (u.priority || 100)],
      ['CodexFit ID', p.id ?? '—'],
      ['Phone', p.telephone ? escHtml(p.telephone) : '—'],
      ['Account created', fmtDate(p.createdAt) || '—'],
      ['Signed up here', fmtDate(u.created_at) || '—'],
      ['Last seen', u.last_seen_at ? `${relativeTime(u.last_seen_at)} · ${fmtDateTime(u.last_seen_at)}` : '—'],
      ['Profile cached', u.profile_synced_at ? `${relativeTime(u.profile_synced_at)}` : '<span class="pill pill-muted">never</span>'],
      ['Session valid until', fmtDateTime(u.jwt_expires_at) || '—'],
    ];
    return section('Overview', `<dl class="kv-grid">${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`);
  }

  // C6-4: background relogin trouble, one pill per affected gym. Red = automatic
  // sign-in suspended after repeated credential rejections (user must re-link);
  // muted = consecutive failures still being retried.
  function reloginBadges(issues) {
    if (!issues || !issues.length) return '';
    return `<div class="relogin-issues" data-relogin-issues>${issues.map(i =>
      `<span class="pill ${i.suspended ? 'pill-red' : 'pill-muted'}" data-gym-id="${escHtml(i.gym_id)}"
        title="${i.suspended ? 'Automatic sign-in paused after repeated rejections. The user must re-link this gym.' : 'Consecutive failed background sign-ins'}${i.last_relogin_failure_at ? ' · last ' + escHtml(fmtDateTime(i.last_relogin_failure_at)) : ''}">
        ${escHtml(i.gym_name)}: ${i.failures} relogin fail${i.failures === 1 ? '' : 's'}${i.suspended ? ' · paused' : ''}</span>`).join(' ')}</div>`;
  }

  function sectionGyms(d) {
    const gyms = d.gyms || [];
    if (!gyms.length) return section('Linked gyms', `<div class="empty">No gyms linked.</div>`, 0);
    const items = gyms.map(g => {
      const enabledPill = g.gym_enabled ? '<span class="pill pill-green">Enabled</span>' : '<span class="pill pill-muted">Disabled</span>';
      const vip = g.priority < 100 ? ` · <span class="pill pill-accent">${g.priority} VIP</span>` : '';
      const relogin = g.relogin_failures > 0
        ? `<div class="item-meta" data-relogin-detail><span class="pill ${g.relogin_suspended ? 'pill-red' : 'pill-muted'}">${g.relogin_failures} consecutive relogin failure${g.relogin_failures === 1 ? '' : 's'}${g.relogin_suspended ? ' · auto sign-in paused' : ''}</span>
            ${g.last_relogin_failure_at ? ` last ${fmtDateTime(g.last_relogin_failure_at)}` : ''}${g.last_relogin_error ? ` · ${escHtml(g.last_relogin_error)}` : ''}</div>`
        : '';
      return `<div class="item"><div class="item-head"><span class="item-title">${escHtml(g.gym_name)}</span>
        ${enabledPill}</div>
        <div class="item-meta">${escHtml(g.provider)} · linked ${fmtDate(g.created_at)}${vip}</div>${relogin}</div>`;
    }).join('');
    return section('Linked gyms', items, gyms.length);
  }

  function sectionBookingWindow(d) {
    const w = d.bookingWindow;
    if (!w && d.detectedBookingOffset == null) {
      return section('Booking window', `<div class="empty">Not detected yet (user hasn't synced their profile).</div>`);
    }
    const offset = w ? w.offsetDays : d.detectedBookingOffset;
    const weeks = w ? w.weeks : Math.max(1, Math.round(offset / 7));
    const label = describeWindow(offset, w && w.cutoffISO);
    const src = w && w.source ? `<span class="pill pill-muted">${escHtml(w.source)}</span>` : '';
    const credits = w && w.extendedCredits ? ` · ${w.extendedCredits} advance-booking credit(s)` : '';
    return section('Booking window',
      `<dl class="kv-grid">
        <dt>Window</dt><dd>${weeks} week${weeks === 1 ? '' : 's'} ${src}</dd>
        <dt>Detail</dt><dd>${escHtml(label)}${credits}</dd>
        <dt>Offset</dt><dd>${offset} days</dd>
      </dl>`);
  }

  function sectionStats(d) {
    const s = d.stats;
    const boxes = [
      ['Unique attended', s.totalUniqueBookingsAttended],
      ['Unique booked', s.totalUniqueBookings],
      ['Total bookings', s.totalBookings],
      ['Credits left', s.creditsRemaining],
      ['Minutes ridden', s.totalAttendedMinutes],
    ].filter(([, v]) => v != null && v !== '');
    if (boxes.length === 0) return section('Stats', `<div class="empty">No stats in cached profile.</div>`);
    return section('Stats',
      `<div class="stat-row">${boxes.map(([l, v]) => `<div class="stat-box"><div class="v">${escHtml(String(v))}</div><div class="l">${l}</div></div>`).join('')}</div>`);
  }

  function sectionCredits(d) {
    if (!d.credits.length) return section('Credits', `<div class="empty">No credits on file.</div>`, 0);
    const items = d.credits.map(c => {
      const name = c.credit_type?.name || c.name || 'Credit';
      const count = c.count ?? c.quantity ?? 0;
      const expiry = c.expires_at || c.expiry_date;
      return `<div class="item"><div class="item-head"><span class="item-title">${escHtml(name)}</span>
        <span class="pill ${count > 0 ? 'pill-green' : 'pill-muted'}">${count} left</span></div>
        ${expiry ? `<div class="item-meta">Expires ${fmtDate(expiry)}</div>` : ''}</div>`;
    }).join('');
    return section('Credits', items, d.credits.length);
  }

  function sectionSubscriptions(d) {
    const subs = d.subscriptions || [];
    const statuses = d.subscriptionStatuses || [];
    let entries;
    if (subs.length) entries = subs;
    else if (statuses.length) entries = statuses;
    else return section('Subscriptions', `<div class="empty">No subscriptions.</div>`, 0);
    const items = entries.map(entry => {
      const status = typeof entry === 'string' ? entry : (entry.status || entry.state || '');
      const name = typeof entry === 'string' ? 'Subscription' : (entry.name || entry.plan?.name || entry.product?.name || 'Subscription');
      const renews = typeof entry === 'string' ? null : (entry.renews_at || entry.current_period_end || entry.next_billing_at);
      const isActive = /activ/.test(String(status).toLowerCase()) && !/inactiv|cancel/.test(String(status).toLowerCase());
      const pillCls = isActive ? 'pill-green' : 'pill-red';
      const pillText = isActive ? 'Active' : 'Inactive';
      return `<div class="item"><div class="item-head"><span class="item-title">${escHtml(name)}</span>
        <span class="pill ${pillCls}">${pillText}</span></div>
        ${renews ? `<div class="item-meta">Renews ${fmtDate(renews)}</div>` : ''}</div>`;
    }).join('');
    return section('Subscriptions', items, entries.length);
  }

  function sectionBookings(d) {
    if (!d.bookings.length) return section('Booked classes', `<div class="empty">No upcoming bookings.</div>`, 0);
    const items = d.bookings.map(b => {
      const title = [b.group_name, b.class_name].filter(Boolean).join(' · ') || b.class_name || 'Class';
      const when = fmtDateTime(b.start_at);
      const where = [b.studio_name, b.location_name].filter(Boolean).join(', ');
      const spot = b.slot_label ? `<span class="pill pill-muted">Spot ${escHtml(String(b.slot_label))}</span>` : '';
      let upgrade = '<span class="pill pill-muted">no upgrade</span>';
      if (b.upgrade) {
        const st = b.upgrade.status;
        const cls = st === 'active' ? 'pill-accent' : (st === 'upgraded' || st === 'cutoff_booked' ? 'pill-green' : 'pill-muted');
        upgrade = `<span class="pill ${cls}">⬆ ${escHtml(st)}</span>`;
      }
      return `<div class="item">
        <div class="item-head"><span class="item-title">${escHtml(title)}</span><span style="display:flex;gap:5px">${spot}${upgrade}</span></div>
        <div class="item-sub">${escHtml(when || '')}${b.instructor_name ? ' · ' + escHtml(b.instructor_name) : ''}</div>
        ${where ? `<div class="item-meta">${escHtml(where)}</div>` : ''}</div>`;
    }).join('');
    return section('Booked classes', items, d.bookings.length);
  }

  function autoBookItemHtml(a) {
    const title = [a.group_name, a.class_name].filter(Boolean).join(' · ') || a.class_name || 'Class';
    const cls = a.status === 'pending' ? 'pill-accent' : (a.status === 'success' ? 'pill-green' : (a.status === 'failed' ? 'pill-red' : 'pill-muted'));
    const prefs = a.preferences || {};
    const slots = (prefs.preferredSlots || []).map((s, i) => `<span class="chip rank">${i + 1}: ${escHtml(String(s))}</span>`).join('');
    const qty = prefs.requiredCount ? `<span class="chip">×${prefs.requiredCount}</span>` : '';
    return `<div class="item">
      <div class="item-head"><span class="item-title">${escHtml(title)}</span><span class="pill ${cls}">${escHtml(a.status)}</span></div>
      <div class="item-sub">${escHtml(fmtDateTime(a.start_at) || '')}${a.instructor_name ? ' · ' + escHtml(a.instructor_name) : ''}</div>
      ${a.studio_name ? `<div class="item-meta">${escHtml(a.studio_name)}</div>` : ''}
      ${(slots || qty) ? `<div class="chip-row">${qty}${slots}</div>` : ''}
      ${a.execution_message ? `<div class="item-meta">${escHtml(a.execution_message)}</div>` : ''}</div>`;
  }

  function autoUpgradeItemHtml(u) {
    const title = [u.group_name, u.class_name].filter(Boolean).join(' · ') || u.class_name || 'Class';
    const cls = u.status === 'active' ? 'pill-accent' : (u.status === 'upgraded' || u.status === 'cutoff_booked' ? 'pill-green' : 'pill-muted');
    const prefs = u.preferences || {};
    const slots = (prefs.preferredSlots || []).map((s, i) => `<span class="chip rank">${i + 1}: ${escHtml(String(s))}</span>`).join('');
    return `<div class="item">
      <div class="item-head"><span class="item-title">${escHtml(title)}</span><span class="pill ${cls}">${escHtml(u.status)}</span></div>
      <div class="item-sub">${escHtml(fmtDateTime(u.start_at) || '')} · current slot ${escHtml(String(u.current_slot_id))}</div>
      ${slots ? `<div class="chip-row">${slots}</div>` : ''}
      ${u.status_message ? `<div class="item-meta">${escHtml(u.status_message)}</div>` : ''}</div>`;
  }

  function renderHistoryPage(itemsContainerId, list, page, itemFn) {
    const el = document.getElementById(itemsContainerId);
    if (!el) return;
    const totalPages = Math.max(1, Math.ceil(list.length / HISTORY_PAGE_SIZE));
    const slice = list.slice(page * HISTORY_PAGE_SIZE, page * HISTORY_PAGE_SIZE + HISTORY_PAGE_SIZE);
    el.innerHTML = slice.length ? slice.map(itemFn).join('') : '<div class="empty">No history.</div>';
    const label = document.getElementById(itemsContainerId + '-label');
    const prev = document.getElementById(itemsContainerId + '-prev');
    const next = document.getElementById(itemsContainerId + '-next');
    if (label) label.textContent = `Page ${page + 1} of ${totalPages}`;
    if (prev) prev.disabled = page === 0;
    if (next) next.disabled = page >= totalPages - 1;
  }

  function wireHistoryControls() {
    const d = currentDetail;
    if (!d) return;
    // Auto-book history
    const abToggle = document.getElementById('ab-history-toggle');
    if (abToggle) {
      const abHistory = (d.autoBookings || []).filter(a => a.status !== 'pending').sort((a, b) => b.id - a.id);
      abToggle.addEventListener('click', () => {
        const block = document.getElementById('ab-history-block');
        const open = block.classList.toggle('open');
        abToggle.textContent = open ? 'Hide history' : `Show history (${abHistory.length})`;
        if (open) renderHistoryPage('ab-history-items', abHistory, abHistoryPage, autoBookItemHtml);
      });
      document.getElementById('ab-history-items-prev')?.addEventListener('click', () => {
        abHistoryPage = Math.max(0, abHistoryPage - 1);
        renderHistoryPage('ab-history-items', abHistory, abHistoryPage, autoBookItemHtml);
      });
      document.getElementById('ab-history-items-next')?.addEventListener('click', () => {
        const maxPage = Math.max(0, Math.ceil(abHistory.length / HISTORY_PAGE_SIZE) - 1);
        abHistoryPage = Math.min(maxPage, abHistoryPage + 1);
        renderHistoryPage('ab-history-items', abHistory, abHistoryPage, autoBookItemHtml);
      });
    }
    // Auto-upgrade history
    const auToggle = document.getElementById('au-history-toggle');
    if (auToggle) {
      const auHistory = (d.autoUpgrades || []).filter(u => u.status !== 'active').sort((a, b) => b.id - a.id);
      auToggle.addEventListener('click', () => {
        const block = document.getElementById('au-history-block');
        const open = block.classList.toggle('open');
        auToggle.textContent = open ? 'Hide history' : `Show history (${auHistory.length})`;
        if (open) renderHistoryPage('au-history-items', auHistory, auHistoryPage, autoUpgradeItemHtml);
      });
      document.getElementById('au-history-items-prev')?.addEventListener('click', () => {
        auHistoryPage = Math.max(0, auHistoryPage - 1);
        renderHistoryPage('au-history-items', auHistory, auHistoryPage, autoUpgradeItemHtml);
      });
      document.getElementById('au-history-items-next')?.addEventListener('click', () => {
        const maxPage = Math.max(0, Math.ceil(auHistory.length / HISTORY_PAGE_SIZE) - 1);
        auHistoryPage = Math.min(maxPage, auHistoryPage + 1);
        renderHistoryPage('au-history-items', auHistory, auHistoryPage, autoUpgradeItemHtml);
      });
    }
  }

  function sectionAutoBook(d) {
    const list = d.autoBookings || [];
    const pending = list.filter(a => a.status === 'pending');
    const history = list.filter(a => a.status !== 'pending').sort((a, b) => b.id - a.id);
    const pendingHtml = pending.length ? pending.map(autoBookItemHtml).join('') : '<div class="empty">No pending auto-books.</div>';
    const historyHtml = history.length ? `
      <button class="history-toggle" id="ab-history-toggle">Show history (${history.length})</button>
      <div class="history-block" id="ab-history-block">
        <div id="ab-history-items"></div>
        <div class="pager">
          <button id="ab-history-items-prev">←</button>
          <span id="ab-history-items-label">Page 1 of 1</span>
          <button id="ab-history-items-next">→</button>
        </div>
      </div>` : '';
    return section('Auto-book queue', `${pendingHtml}${historyHtml}`, pending.length);
  }

  function sectionAutoUpgrade(d) {
    const list = d.autoUpgrades || [];
    const active = list.filter(u => u.status === 'active');
    const history = list.filter(u => u.status !== 'active').sort((a, b) => b.id - a.id);
    const activeHtml = active.length ? active.map(autoUpgradeItemHtml).join('') : '<div class="empty">No active upgrade monitors.</div>';
    const historyHtml = history.length ? `
      <button class="history-toggle" id="au-history-toggle">Show history (${history.length})</button>
      <div class="history-block" id="au-history-block">
        <div id="au-history-items"></div>
        <div class="pager">
          <button id="au-history-items-prev">←</button>
          <span id="au-history-items-label">Page 1 of 1</span>
          <button id="au-history-items-next">→</button>
        </div>
      </div>` : '';
    return section('Auto-upgrade monitors', `${activeHtml}${historyHtml}`, active.length);
  }

  function sectionSpotMaps(d) {
    const names = d.studioNames || {};
    const list = (d.studioPreferences || []).filter(m => {
      const p = m.preferences || {};
      return (p.preferredSlots || []).length > 0 || (p.preferredRows || []).length > 0;
    });
    if (!list.length) return section('Preferred spot maps', `<div class="empty">No spot maps saved.</div>`, 0);
    const items = list.map(m => {
      const prefs = m.preferences || {};
      const slots = (prefs.preferredSlots || []).map((s, i) => `<span class="chip rank">${i + 1}: ${escHtml(String(s))}</span>`).join('');
      const rows = (prefs.preferredRows || []).map(r => `<span class="chip">row ${escHtml(String(r))}</span>`).join('');
      const inner = (slots || rows)
        ? `<div class="chip-row">${slots}${rows}</div>`
        : `<div class="item-meta">Any available spot</div>`;
      const title = names[String(m.studio_id)] || `Studio ${m.studio_id}`;
      return `<div class="item"><div class="item-title">${escHtml(String(title))}</div>${inner}</div>`;
    }).join('');
    return section('Preferred spot maps', items, list.length);
  }

  // ── Drawer helpers ──────────────────────────────────────────────────────────

  function section(title, inner, count) {
    const badge = (count !== undefined) ? `<span class="count">${count}</span>` : '';
    return `<div class="section"><div class="section-title">${title}${badge}</div>${inner}</div>`;
  }

  function fmtDate(iso) {
    if (!iso) return '';
    const dt = new Date(iso);
    if (isNaN(dt)) return '';
    return dt.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  }
  function fmtDateTime(iso) {
    if (!iso) return '';
    const dt = new Date(iso);
    if (isNaN(dt)) return '';
    return dt.toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  }
  function relativeTime(iso) {
    if (!iso) return 'never';
    const dt = new Date(iso);
    if (isNaN(dt)) return '—';
    const diff = Date.now() - dt.getTime();
    const min = Math.round(diff / 60000);
    if (min < 1) return 'just now';
    if (min < 60) return `${min}m ago`;
    const hr = Math.round(min / 60);
    if (hr < 24) return `${hr}h ago`;
    const days = Math.round(hr / 24);
    if (days < 30) return `${days}d ago`;
    return fmtDate(iso);
  }
  // Mirror of client lib.js describeBookingWindow (kept minimal — admin is standalone).
  function describeWindow(offsetDays, cutoffISO) {
    const weeks = Math.max(1, Math.round(offsetDays / 7));
    const wordLabel = `${weeks} week${weeks === 1 ? '' : 's'}`;
    let through = cutoffISO ? fmtDate(cutoffISO) : '';
    if (!through) {
      // Derive from the most recent Monday-noon release + offset.
      const now = new Date();
      const release = new Date(now);
      const day = (release.getDay() + 6) % 7; // 0 = Monday
      release.setDate(release.getDate() - day);
      release.setHours(12, 0, 0, 0);
      if (release > now) release.setDate(release.getDate() - 7);
      release.setDate(release.getDate() + offsetDays);
      through = fmtDate(release.toISOString());
    }
    return through ? `${wordLabel} · books through ${through}` : wordLabel;
  }

  function escHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Event wiring ──────────────────────────────────────────────────────────

  document.getElementById('login-btn').addEventListener('click', doLogin);
  document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  document.getElementById('logout-btn').addEventListener('click', doLogout);

  document.getElementById('drawer-close').addEventListener('click', closeDrawer);
  document.getElementById('drawer-overlay').addEventListener('click', closeDrawer);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

  document.getElementById('reset-cancel').addEventListener('click', () => {
    document.getElementById('reset-overlay').classList.remove('open');
    pendingReset = null;
  });

  document.getElementById('reset-ok').addEventListener('click', async () => {
    if (!pendingReset) return;
    const btn = document.getElementById('reset-ok');
    const resultEl = document.getElementById('reset-result');
    btn.disabled = true;
    btn.textContent = 'Resetting…';
    try {
      const res = await apiFetch(`/api/admin/users/${pendingReset.id}/reset-password`, {
        method: 'POST',
        body: JSON.stringify({
          resetGymCredentials: document.getElementById('reset-clear-gyms').checked,
        }),
      });
      const d = await res.json();
      if (!res.ok) throw new Error(d.message);

      // Shown exactly once — it is not stored in plaintext and cannot be
      // retrieved again. Make that unmissable rather than a quiet toast.
      resultEl.style.display = 'block';
      resultEl.innerHTML =
        `<div style="border:1px solid rgba(201,83,79,0.35);background:var(--red-dim);border-radius:8px;padding:12px;">
           <div style="font-size:12px;color:var(--text-muted);margin-bottom:6px;">
             Temporary password for ${escHtml(d.email)} — shown once, copy it now.
           </div>
           <code id="reset-temp" style="display:block;font-size:15px;word-break:break-all;user-select:all;">${escHtml(d.tempPassword)}</code>
           <button class="btn" id="reset-copy" style="margin-top:10px;">Copy</button>
           <div style="font-size:12px;color:var(--text-muted);margin-top:10px;line-height:1.5;">
             ${d.clearedGyms.length
               ? `Gym credentials cleared: <strong>${d.clearedGyms.map(escHtml).join(', ')}</strong>. They will need to re-authenticate each gym in Settings → Your Gyms.`
               : 'Gym credentials were left in place.'}
             <br>Send this over a trusted channel and have them change it in Settings.
           </div>
         </div>`;
      document.getElementById('reset-copy').addEventListener('click', () => {
        navigator.clipboard.writeText(d.tempPassword)
          .then(() => { document.getElementById('reset-copy').textContent = 'Copied'; })
          .catch(() => { document.getElementById('reset-copy').textContent = 'Copy failed — select it manually'; });
      });
      // No second reset from this dialog: the button is gone and Cancel becomes
      // Close, so the only way out is acknowledging the password was shown.
      btn.style.display = 'none';
      document.getElementById('reset-cancel').textContent = 'Close';
      pendingReset = null;
    } catch (err) {
      resultEl.style.display = 'block';
      resultEl.innerHTML = `<div style="color:var(--red);font-size:13px;">${escHtml(err.message)}</div>`;
    } finally {
      btn.disabled = false;
      btn.textContent = 'Reset password';
    }
  });

  document.getElementById('confirm-cancel').addEventListener('click', () => {
    document.getElementById('confirm-overlay').classList.remove('open');
    pendingDelete = null;
  });

  document.getElementById('confirm-ok').addEventListener('click', async () => {
    if (!pendingDelete) return;
    const btn = document.getElementById('confirm-ok');
    btn.disabled = true;
    btn.textContent = 'Deleting…';
    try {
      const res = await apiFetch(`/api/admin/users/${pendingDelete.id}`, { method: 'DELETE' });
      if (!res.ok) { const d = await res.json(); throw new Error(d.message); }
      document.getElementById('confirm-overlay').classList.remove('open');
      pendingDelete = null;
      loadUsers();
    } catch (e) {
      alert(e.message);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Delete';
    }
  });

  // ── Gym presentation editor (F-7 Stage B) ─────────────────────────────────

  const GE_KEYS = ['ink', 'inkHover', 'tint', 'on', 'btn', 'wash', 'pip'];
  let geGyms = [];
  const geEl = (id) => document.getElementById(id);

  function geMsg(text, kind) { const m = geEl('ge-msg'); m.textContent = text || ''; m.className = kind || ''; }

  function geBuildColourInputs() {
    for (const mode of ['light', 'dark']) {
      geEl('ge-' + mode).innerHTML = GE_KEYS.map(k =>
        `<input data-mode="${mode}" data-key="${k}" placeholder="${k}" aria-label="${mode} ${k}">`).join('');
    }
  }

  function geFill(p) {
    geEl('ge-short').value = p.shortName || '';
    geEl('ge-text').value = (p.wordmark && p.wordmark.text) || '';
    for (const k of ['full', 'compact', 'mark']) geEl('ge-' + k).value = (p.wordmark && p.wordmark[k] && p.wordmark[k].src) || '';
    geEl('ge-squaremark').checked = !!(p.wordmark && p.wordmark.squareMark);
    geEl('ge-plate').value = p.plate || '';
    document.querySelectorAll('#gym-editor .ge-colors input').forEach(i => { i.value = (p[i.dataset.mode] || {})[i.dataset.key] || ''; });
    geEl('ge-aliases').value = JSON.stringify(p.displayAliases || {}, null, 2);
    geRenderPreview();
  }

  // Throws on unparseable alias JSON; all other checks are the server validator's.
  function geRead() {
    const wordmark = { text: geEl('ge-text').value };
    for (const k of ['full', 'compact', 'mark']) { const v = geEl('ge-' + k).value.trim(); if (v) wordmark[k] = { src: v }; }
    if (geEl('ge-squaremark').checked) wordmark.squareMark = true;
    const p = { shortName: geEl('ge-short').value, wordmark, plate: geEl('ge-plate').value.trim(), light: {}, dark: {} };
    document.querySelectorAll('#gym-editor .ge-colors input').forEach(i => { const v = i.value.trim(); if (v) p[i.dataset.mode][i.dataset.key] = v; });
    p.displayAliases = JSON.parse(geEl('ge-aliases').value || '{}');
    return p;
  }

  const geSafeColour = (c) => /^#[0-9a-fA-F]{6}$/.test(c) ? c : 'transparent';
  const geSafeSrc = (s) => /^\/gyms\/[\w.\-]+(\?[\w=&.\-]*)?$/.test(s) ? s : '';

  function geRenderPreview() {
    let p;
    try { p = geRead(); } catch (e) { geEl('ge-previews').innerHTML = ''; return; }
    const surfaces = { light: { bg: '#ffffff', fg: '#1a1a1a' }, dark: { bg: '#141414', fg: '#f0f0f0' } };
    geEl('ge-previews').innerHTML = ['light', 'dark'].map(mode => {
      const c = p[mode], sf = surfaces[mode];
      const src = geSafeSrc((p.wordmark.full || p.wordmark.compact || p.wordmark.mark || {}).src || '');
      const logo = src ? `<img src="${escHtml(src)}" alt="${escHtml(p.shortName)}">` : escHtml(p.wordmark.text);
      return `<div class="ge-preview" data-mode="${mode}" style="background:${sf.bg};color:${sf.fg}">
        <div class="pv-title">${mode} preview</div>
        <span class="pv-plate" style="background:${geSafeColour(p.plate)};color:#fff">${logo}</span>
        <div class="pv-row" style="background:${geSafeColour(c.tint)}26;border-left:3px solid ${geSafeColour(c.tint)}">
          <span style="color:${geSafeColour(c.ink)}">${escHtml(p.shortName)} · 18:30 Class</span>
          <span class="pv-pill" style="background:${geSafeColour(c.tint)};color:${geSafeColour(c.on)}">Book</span>
        </div></div>`;
    }).join('');
  }

  function geCurrent() { return geGyms.find(g => g.id === geEl('ge-gym').value); }

  function geSelect() {
    const g = geCurrent(); if (!g) return;
    geFill(g.presentation);
    geEl('ge-badge').textContent = g.overridden ? 'Using admin override' : 'Using registry values';
    geMsg('');
  }

  async function loadGymEditor() {
    geBuildColourInputs();
    try {
      const res = await apiFetch('/api/admin/gym-presentations');
      geGyms = (await res.json()).gyms || [];
      geEl('ge-gym').innerHTML = geGyms.map(g => `<option value="${escHtml(g.id)}">${escHtml(g.name)} (${escHtml(g.provider)})</option>`).join('');
      geSelect();
    } catch (e) { geMsg(e.message, 'err'); }
  }

  async function geSend(path, method, body) {
    const g = geCurrent();
    const res = await apiFetch(`/api/admin/gym-presentations/${encodeURIComponent(g.id)}${path}`, { method, body: body ? JSON.stringify(body) : undefined });
    const data = await res.json();
    return { res, data };
  }

  async function geDo(kind) {
    try {
      if (kind === 'validate' || kind === 'save') {
        const { res, data } = await geSend(kind === 'validate' ? '/validate' : '', kind === 'validate' ? 'POST' : 'PUT', { presentation: geRead() });
        if (!res.ok) return geMsg(data.message || 'Invalid', 'err');
        if (kind === 'save') { Object.assign(geCurrent(), data); geSelect(); }
        geMsg(kind === 'save' ? 'Saved and applied.' : 'Valid.', 'ok');
      } else if (kind === 'reset') {
        const { data } = await geSend('', 'DELETE'); Object.assign(geCurrent(), data); geSelect(); geMsg('Reset to registry values.', 'ok');
      } else if (kind === 'test') {
        geMsg('Testing (read-only)…');
        const { data } = await geSend('/test-connection', 'POST');
        if (data.ok) geMsg(`Connected in ${data.latencyMs}ms: ${data.counts.locations} locations, ${data.counts.studios} studios, ${data.counts.instructors} instructors. Nothing was booked or changed.`, 'ok');
        else geMsg(`Connection failed${data.status ? ' (HTTP ' + data.status + ')' : ''}: ${data.message}`, 'err');
      }
    } catch (e) { geMsg(e.message, 'err'); }
  }

  geEl('ge-gym').addEventListener('change', geSelect);
  document.getElementById('gym-editor').addEventListener('input', geRenderPreview);
  for (const k of ['validate', 'save', 'reset', 'test']) geEl('ge-' + k).addEventListener('click', () => geDo(k));

  // ── Init ──────────────────────────────────────────────────────────────────

  if (adminToken) {
    showAdmin();
  } else {
    showLogin();
  }
</script>
</body>
