<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teams empty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">

<body data-nav="teams">
<main class="page">
  <div class="page-head"><h1 class="page-title">Teams</h1></div>
  <section class="card empty" style="margin-top:12px">
    <span class="mascot lg" style="--s:132px"><span class="disc"></span><img src="img/droplet.gif" alt=""></span>
    <h2>Train with your people</h2>
    <p>A Team is a small private group (friends, a couple, your running club) that can see who's doing which classes, so you can book in together. You choose what each Team sees.</p>
    <div style="display:grid;gap:8px;max-width:320px;margin:0 auto">
      <button class="btn primary pill block">Create a Team</button>
    </div>
  </section>
  <div class="card join-card" style="margin-top:16px">
    <div class="card-head" style="margin-bottom:0"><h3 class="card-title">Got an invite link?</h3></div>
    <div class="field"><span class="grow">Paste a Team link</span><button class="btn sm primary">Open</button></div>
  </div>
</main>
</body>
