global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: mcp-stage

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: stage-app
    metrics_path: /metrics
    static_configs:
      - targets: [sweatassistant-mcp-stage:3000]
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token

  - job_name: stage-alert-receiver
    static_configs:
      - targets: [receiver:9091]
