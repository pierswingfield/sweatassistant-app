# Landing site (workstream M, decision M-D2). Static files plus a proxy for /_a/ to the app.
# Re-resolve the upstream at request time so nginx still starts if `sweatassistant` is down.
resolver 127.0.0.11 valid=10s ipv6=off;

# Edge rate limit for the public analytics routes (the app has its own 120/min limiter too).
limit_req_zone $http_cf_connecting_ip zone=analytics:1m rate=60r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Security headers (repeated in each location that adds its own headers).
    set $sec_csp "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy $sec_csp always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # HTML: short cache.
    location = / {
        add_header Cache-Control "public, no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy $sec_csp always;
        try_files /index.html =404;
    }
    location = /index.html {
        return 301 /;
    }

    # Gym logos: long cache.
    location /gyms/ {
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Instructor avatars: unversioned filenames, so a short cache.
    location /instructors/ {
        add_header Cache-Control "public, max-age=86400" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Droplet mascot (header gif + run-in video): unversioned filenames, so a short cache.
    # Static files are served with Range support, which the video needs for seeking.
    location /dibs/ {
        add_header Cache-Control "public, max-age=86400" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Analytics pixel and CTA redirect, served by the app (server/landing-events.js).
    # Path is passed through unchanged (app mounts at /_a).
    location /_a/ {
        limit_req zone=analytics burst=30 nodelay;
        set $upstream http://sweatassistant:3000;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_set_header User-Agent $http_user_agent;
        proxy_set_header Referer $http_referer;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Same-origin public gym catalogue; the registry's enabled state controls
    # which brands the landing page advertises.
    location = /gym-catalogue {
        set $catalogue_upstream http://sweatassistant:3000;
        proxy_pass $catalogue_upstream/api/gyms;
        add_header Cache-Control "no-store" always;
    }

    location = /robots.txt { try_files $uri =404; }
    location = /sitemap.xml { try_files $uri =404; }
    location / { return 404; }
}

# Old landing and www canonicalize only public marketing navigation.
server {
    listen 80;
    server_name dibs.wingfield.tech www.dibs.fit;
    add_header Cache-Control "no-store" always;
    return 302 https://dibs.fit$request_uri;
}

# Old app origins show the move notice. Only token calendar feeds retain the
# old API; no login, admin or API write is forwarded to the application.
map $host $legacy_calendar_upstream {
    default http://sweatassistant:3000;
    sweat-dev.wingfield.tech http://sweatassistant-dev:3000;
    sweat-experiment.wingfield.tech http://sweatassistant-experiment:3000;
}
server {
    listen 80;
    server_name sweat.wingfield.tech sweat-dev.wingfield.tech sweat-experiment.wingfield.tech;
    root /usr/share/nginx/html;
    server_tokens off;
    access_log off; # Feed and invite tokens must never enter access logs.
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'; worker-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    location ~ ^/api/calendar/[A-Za-z0-9_-]+\.ics$ {
        limit_except GET HEAD { deny all; }
        proxy_pass $legacy_calendar_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-cache, max-age=0" always;
        add_header Referrer-Policy "no-referrer" always;
    }
    location = /sw.js { default_type application/javascript; try_files /retired-sw.js =404; }
    location /dibs/ { try_files $uri =404; }
    location /api/ { default_type application/json; return 410 '{"error":"This app has moved to https://app.dibs.fit"}'; }
    location / { limit_except GET HEAD { deny all; } try_files /holding.html =404; }
}
