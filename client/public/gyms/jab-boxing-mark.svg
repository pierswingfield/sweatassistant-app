<svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 36 36" aria-hidden="true" focusable="false">
  <!-- The J's mass sits on its right, so a geometrically centred glyph looks
       right-heavy in a circle. The glyph (x 1.55-22.48 of its original box) sits
       about 7 units left of the frame centre; the frame is wide enough that it
       never clips. To nudge further, change the translate x, keeping the glyph's
       left edge (1.55 + x) above 0 - past that, widen the viewBox. -->
  <g transform="translate(4.5 6)">
    <path d="M22.48 0v18.71c-.73 6.3-12.96 5.9-17.34 4.3C3.46 22.4 1.55 20.57 1.55 18.71v-7.07h9.2v6.44l.3.33c.7.36 1.52.22 1.6-.64V0z" fill="#f9f6f5"/>
  </g>
</svg>
