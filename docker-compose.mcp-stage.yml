# Isolated candidate only. See Documentation/Operations/MCP-STAGING.md.
# Supply a locally built ARM64 image from the recorded clean candidate.
name: sweatassistant-mcp-stage
services:
  sweatassistant-mcp-stage:
    image: ${MCP_STAGE_IMAGE:?Set an immutable candidate image tag or digest}
    container_name: sweatassistant-mcp-stage
    env_file: .env.mcp-stage
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_PATH: /data/app.db
      PUBLIC_HOST: sweat-mcp-stage.wingfield.tech
      CORS_ORIGINS: https://sweat-mcp-stage.wingfield.tech
      MCP_ENABLED: ${MCP_STAGE_ENABLED:-true}
      MCP_AUTH_SERVER_ENABLED: ${MCP_STAGE_ENABLED:-true}
      MCP_PROVIDER_READS_ENABLED: "false"
      MCP_STAGE_JAB_PROFILE_ONLY: "true"
      MCP_STAGE_JAB_GATEWAY_URL: http://jab-profile-egress:3100
      MCP_STAGE_JAB_GATEWAY_KEY: ${MCP_STAGE_JAB_GATEWAY_KEY:?Set a private stage gateway key}
      MCP_RESOURCE_URL: https://sweat-mcp-stage.wingfield.tech/mcp
      MCP_ISSUER: https://sweat-mcp-stage.wingfield.tech/
      MCP_JWKS_FILE: /private/mcp/jwks.json
      MCP_SIGNING_KEY_FILE: /private/mcp/signing.json
      MCP_CLIENTS_FILE: /private/mcp/clients.json
    volumes:
      - type: bind
        source: ./data-mcp-stage
        target: /data
        bind: { create_host_path: false }
      - type: bind
        source: ./private-mcp-stage
        target: /private/mcp
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ./private-mcp-stage/read-window-config
        target: /private/read-window
        read_only: true
        bind: { create_host_path: false }
    mem_limit: 768m
    cpus: "0.50"
    pids_limit: 128
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    restart: unless-stopped
    networks: [mcp-stage-private]
    # No provider egress. JAB login/profile goes through the constrained gateway only.
  jab-profile-egress:
    image: ${MCP_STAGE_IMAGE:?Set an immutable candidate image tag or digest}
    container_name: jab-profile-egress
    command: ["node", "server/mcp-stage-jab-egress.js"]
    environment:
      MCP_STAGE_JAB_GATEWAY_KEY: ${MCP_STAGE_JAB_GATEWAY_KEY:?Set a private stage gateway key}
      MCP_STAGE_JAB_GATEWAY_PORT: "3100"
      MCP_STAGE_JAB_READ_STATE_FILE: /private/read-window-state/state.json
    volumes:
      - type: bind
        source: ./private-mcp-stage/read-window-config
        target: /private/read-window
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ./private-mcp-stage/read-window-state
        target: /private/read-window-state
        bind: { create_host_path: false }
    mem_limit: 128m
    cpus: "0.25"
    pids_limit: 32
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }
    restart: unless-stopped
    networks: [mcp-stage-private, mcp-stage-egress]
    # No host listener. Its only allowed upstream requests are hard-coded JAB auth/profile paths.
networks:
  mcp-stage-private:
    driver: bridge
    internal: true
  mcp-stage-egress:
    driver: bridge
