<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Psycle Assistant — Admin</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0e0d;
      --surface: #1a1816;
      --surface-2: #252220;
      --border: #2e2b28;
      --text: #e8e0d5;
      --text-muted: #8a8278;
      --accent: #e87d3e;
      --accent-dim: rgba(232,125,62,0.15);
      --green: #5aab6e;
      --red: #c9534f;
      --red-dim: rgba(201,83,79,0.15);
      --radius: 8px;
      --mono: 'SF Mono', 'Fira Code', monospace;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 0;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { font-size: 15px; font-weight: 600; letter-spacing: 0.02em; color: var(--text); }
    header span { font-size: 11px; color: var(--text-muted); font-family: var(--mono); background: var(--surface-2); padding: 3px 8px; border-radius: 4px; border: 1px solid var(--border); }

    /* Login screen */
    #login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 53px);
    }
    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
      width: 320px;
    }
    .login-card h2 { font-size: 16px; margin-bottom: 20px; }
    .login-card label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
    .login-card input[type=password] {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      padding: 10px 12px;
      font-size: 14px;
      outline: none;
      margin-bottom: 16px;
    }
    .login-card input[type=password]:focus { border-color: var(--accent); }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 500;
      border: none;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:disabled { opacity: 0.4; cursor: default; }
    .btn-primary { background: var(--accent); color: #fff; width: 100%; justify-content: center; padding: 10px; }
    .btn-primary:hover:not(:disabled) { opacity: 0.85; }
    .btn-danger { background: var(--red-dim); color: var(--red); border: 1px solid rgba(201,83,79,0.3); font-size: 12px; padding: 4px 10px; }
    .btn-danger:hover:not(:disabled) { background: var(--red); color: #fff; }
    .error-msg { color: var(--red); font-size: 12px; margin-top: 10px; display: none; }

    /* Main panel */
    #admin-screen { display: none; padding: 24px; }
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .panel-header h2 { font-size: 14px; color: var(--text-muted); font-weight: 500; }
    .stats { display: flex; gap: 12px; }
    .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 6px 14px; font-size: 12px; color: var(--text-muted); }
    .stat strong { color: var(--text); font-size: 14px; display: block; }

    /* Table */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead th {
      text-align: left;
      padding: 8px 12px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    tbody tr { border-bottom: 1px solid var(--border); }
    tbody tr:hover { background: var(--surface); }
    tbody td { padding: 10px 12px; vertical-align: middle; }

    .name { font-weight: 500; }
    .email { font-size: 11px; color: var(--text-muted); font-family: var(--mono); }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      font-family: var(--mono);
    }
    .badge-pending { background: var(--accent-dim); color: var(--accent); }
    .badge-upgrades { background: rgba(90,171,110,0.15); color: var(--green); }
    .badge-zero { color: var(--text-muted); }

    /* Inline priority editor */
    .priority-cell { display: flex; align-items: center; gap: 6px; }
    .priority-input {
      width: 56px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      padding: 4px 8px;
      font-size: 13px;
      font-family: var(--mono);
      text-align: center;
      outline: none;
    }
    .priority-input:focus { border-color: var(--accent); }
    .priority-input.saving { opacity: 0.5; }
    .priority-vip { border-color: var(--accent); background: var(--accent-dim); }

    .created { font-size: 11px; color: var(--text-muted); font-family: var(--mono); }

    .loading { padding: 40px; text-align: center; color: var(--text-muted); }
    .logout-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-muted);
      font-size: 12px;
      padding: 5px 12px;
      cursor: pointer;
    }
    .logout-btn:hover { border-color: var(--text-muted); color: var(--text); }

    .confirm-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .confirm-overlay.open { display: flex; }
    .confirm-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      width: 340px;
    }
    .confirm-card h3 { font-size: 15px; margin-bottom: 8px; }
    .confirm-card p { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.5; }
    .confirm-actions { display: flex; gap: 10px; justify-content: flex-end; }
    .btn-ghost { background: none; border: 1px solid var(--border); color: var(--text-muted); }
    .btn-ghost:hover { border-color: var(--text-muted); color: var(--text); }
  </style>
</head>
<body>

<header>
  <h1>Psycle Assistant — Admin</h1>
  <span id="session-label"></span>
</header>

<!-- Login -->
<div id="login-screen">
  <div class="login-card">
    <h2>Admin Login</h2>
    <label for="pw">Password</label>
    <input type="password" id="pw" autocomplete="current-password" placeholder="Admin password">
    <button class="btn btn-primary" id="login-btn">Sign in</button>
    <div class="error-msg" id="login-error"></div>
  </div>
</div>

<!-- Main -->
<div id="admin-screen">
  <div class="panel-header">
    <h2>Users</h2>
    <div style="display:flex;gap:10px;align-items:center">
      <div class="stats" id="stats"></div>
      <button class="logout-btn" id="logout-btn">Log out</button>
    </div>
  </div>
  <div class="table-wrap">
    <table id="user-table">
      <thead>
        <tr>
          <th>Name / Email</th>
          <th>Priority</th>
          <th>Auto-Books</th>
          <th>Upgrades</th>
          <th>Joined</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="user-tbody"><tr><td colspan="6" class="loading">Loading…</td></tr></tbody>
    </table>
  </div>
</div>

<!-- Delete confirm modal -->
<div class="confirm-overlay" id="confirm-overlay">
  <div class="confirm-card">
    <h3>Delete user?</h3>
    <p id="confirm-text"></p>
    <div class="confirm-actions">
      <button class="btn btn-ghost" id="confirm-cancel">Cancel</button>
      <button class="btn btn-danger" id="confirm-ok">Delete</button>
    </div>
  </div>
</div>

<script>
  const TOKEN_KEY = 'psycleAdminToken';
  let adminToken = localStorage.getItem(TOKEN_KEY);
  let pendingDelete = null;

  // ── Auth ──────────────────────────────────────────────────────────────────

  function setToken(t) {
    adminToken = t;
    if (t) localStorage.setItem(TOKEN_KEY, t);
    else localStorage.removeItem(TOKEN_KEY);
  }

  function showLogin(msg) {
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('admin-screen').style.display = 'none';
    document.getElementById('session-label').textContent = '';
    if (msg) {
      const el = document.getElementById('login-error');
      el.textContent = msg;
      el.style.display = 'block';
    }
  }

  function showAdmin() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('admin-screen').style.display = 'block';
    document.getElementById('session-label').textContent = 'admin session';
    loadUsers();
  }

  async function doLogin() {
    const pw = document.getElementById('pw').value;
    const btn = document.getElementById('login-btn');
    const errEl = document.getElementById('login-error');
    errEl.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Signing in…';
    try {
      const res = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pw })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || 'Login failed');
      setToken(data.token);
      showAdmin();
    } catch (e) {
      errEl.textContent = e.message;
      errEl.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Sign in';
    }
  }

  function doLogout() {
    setToken(null);
    showLogin();
  }

  // ── Users ─────────────────────────────────────────────────────────────────

  async function apiFetch(url, opts = {}) {
    const res = await fetch(url, {
      ...opts,
      headers: { 'Authorization': `Bearer ${adminToken}`, 'Content-Type': 'application/json', ...(opts.headers || {}) }
    });
    if (res.status === 401 || res.status === 403) {
      setToken(null);
      showLogin('Session expired — please log in again.');
      throw new Error('Session expired');
    }
    return res;
  }

  async function loadUsers() {
    const tbody = document.getElementById('user-tbody');
    tbody.innerHTML = '<tr><td colspan="6" class="loading">Loading…</td></tr>';
    try {
      const res = await apiFetch('/api/admin/users');
      const { users } = await res.json();
      renderUsers(users);
    } catch (e) {
      if (adminToken) tbody.innerHTML = `<tr><td colspan="6" class="loading" style="color:var(--red)">${e.message}</td></tr>`;
    }
  }

  function renderUsers(users) {
    const tbody = document.getElementById('user-tbody');
    const statsEl = document.getElementById('stats');

    const totalPending = users.reduce((s, u) => s + (u.pending_bookings || 0), 0);
    const totalUpgrades = users.reduce((s, u) => s + (u.active_upgrades || 0), 0);
    statsEl.innerHTML = `
      <div class="stat"><strong>${users.length}</strong> users</div>
      <div class="stat"><strong>${totalPending}</strong> pending books</div>
      <div class="stat"><strong>${totalUpgrades}</strong> active upgrades</div>
    `;

    if (users.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" class="loading">No users yet.</td></tr>';
      return;
    }

    tbody.innerHTML = users.map(u => {
      const name = u.display_name || '—';
      const joined = u.created_at ? new Date(u.created_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '—';
      const isVip = (u.priority || 100) < 100;
      const pendingBadge = u.pending_bookings > 0
        ? `<span class="badge badge-pending">${u.pending_bookings}</span>`
        : `<span class="badge-zero">—</span>`;
      const upgradesBadge = u.active_upgrades > 0
        ? `<span class="badge badge-upgrades">${u.active_upgrades}</span>`
        : `<span class="badge-zero">—</span>`;
      return `<tr data-id="${u.id}">
        <td>
          <div class="name">${escHtml(name)}</div>
          <div class="email">${escHtml(u.email)}</div>
        </td>
        <td>
          <div class="priority-cell">
            <input
              type="number"
              min="1" max="999"
              class="priority-input${isVip ? ' priority-vip' : ''}"
              value="${u.priority || 100}"
              data-user-id="${u.id}"
              data-original="${u.priority || 100}"
              title="Lower = higher priority. Default 100."
            >
          </div>
        </td>
        <td>${pendingBadge}</td>
        <td>${upgradesBadge}</td>
        <td><span class="created">${joined}</span></td>
        <td>
          <button class="btn btn-danger delete-btn" data-user-id="${u.id}" data-name="${escHtml(name)}" data-email="${escHtml(u.email)}">
            Delete
          </button>
        </td>
      </tr>`;
    }).join('');

    // Priority save on blur or Enter
    tbody.querySelectorAll('.priority-input').forEach(input => {
      async function savePriority() {
        const userId = parseInt(input.dataset.userId, 10);
        const val = parseInt(input.value, 10);
        const original = parseInt(input.dataset.original, 10);
        if (isNaN(val) || val === original) return;
        input.classList.add('saving');
        try {
          const res = await apiFetch(`/api/admin/users/${userId}/priority`, {
            method: 'PUT',
            body: JSON.stringify({ priority: val })
          });
          if (!res.ok) { const d = await res.json(); throw new Error(d.message); }
          input.dataset.original = val;
          input.classList.toggle('priority-vip', val < 100);
        } catch (e) {
          input.value = original;
          alert(e.message);
        } finally {
          input.classList.remove('saving');
        }
      }
      input.addEventListener('blur', savePriority);
      input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); input.blur(); } });
    });

    // Delete buttons
    tbody.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        pendingDelete = { id: parseInt(btn.dataset.userId, 10), name: btn.dataset.name, email: btn.dataset.email };
        document.getElementById('confirm-text').textContent =
          `This will permanently delete "${pendingDelete.name}" (${pendingDelete.email}) and all their data — bookings, upgrades, preferences, credentials. This cannot be undone.`;
        document.getElementById('confirm-overlay').classList.add('open');
      });
    });
  }

  function escHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Event wiring ──────────────────────────────────────────────────────────

  document.getElementById('login-btn').addEventListener('click', doLogin);
  document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  document.getElementById('logout-btn').addEventListener('click', doLogout);

  document.getElementById('confirm-cancel').addEventListener('click', () => {
    document.getElementById('confirm-overlay').classList.remove('open');
    pendingDelete = null;
  });

  document.getElementById('confirm-ok').addEventListener('click', async () => {
    if (!pendingDelete) return;
    const btn = document.getElementById('confirm-ok');
    btn.disabled = true;
    btn.textContent = 'Deleting…';
    try {
      const res = await apiFetch(`/api/admin/users/${pendingDelete.id}`, { method: 'DELETE' });
      if (!res.ok) { const d = await res.json(); throw new Error(d.message); }
      document.getElementById('confirm-overlay').classList.remove('open');
      pendingDelete = null;
      loadUsers();
    } catch (e) {
      alert(e.message);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Delete';
    }
  });

  // ── Init ──────────────────────────────────────────────────────────────────

  if (adminToken) {
    showAdmin();
  } else {
    showLogin();
  }
</script>
</body>
</html>
