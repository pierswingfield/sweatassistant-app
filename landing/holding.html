<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#faf4f0">
<title>Sweat Assistant is now Dibs!</title>
<link rel="icon" href="/dibs/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap">
<style>
:root{color-scheme:light;background:#faf4f0;color:#1f1b16;font-family:Inter,system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:32px 24px;background:radial-gradient(ellipse at 20% 15%,#f4dfd4,transparent 65%)}
main{width:100%;max-width:600px;text-align:center;padding:36px 16px}img{width:92px;height:92px;object-fit:contain;margin-bottom:24px}
h1{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:clamp(36px,7vw,56px);line-height:1.08;letter-spacing:-.035em;margin:0 0 24px}
p{max-width:470px;margin:0 auto 32px;font-size:17px;line-height:1.65;color:#6b6358}
a{display:inline-flex;align-items:center;justify-content:center;min-height:52px;border-radius:999px;padding:14px 30px;background:#c9785c;color:white;text-decoration:none;font-weight:600;box-shadow:0 7px 24px #c9785c26}a:hover{background:#b5694e}a:focus-visible{outline:3px solid #1f1b16;outline-offset:5px}
</style>
</head>
<body><main>
<img src="/dibs/icon-192.png" alt="Dibs" width="92" height="92">
<h1>Sweat Assistant is now Dibs!</h1>
<p>Please remove the app from your homescreen and reinstall Dibs. You’ll also need to set up your calendar sync again.</p>
<a href="https://app.dibs.fit" rel="noreferrer">Open Dibs</a>
</main></body>
</html>
